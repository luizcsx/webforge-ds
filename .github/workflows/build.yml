name: Build WebForge DS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install NDS toolchain
        run: |
          dkp-pacman -Sy --noconfirm nds-dev

      - name: Diagnose environment
        run: |
          echo "--- calico.h location ---"
          find /opt/devkitpro -name "calico.h" 2>/dev/null || echo "NOT FOUND"
          echo "--- ARM7 ELFs ---"
          find /opt/devkitpro -name "*.elf" 2>/dev/null || echo "NONE"
          echo "--- libnds libs ---"
          ls /opt/devkitpro/libnds/lib/ 2>/dev/null || echo "NO LIBNDS"

      - name: Compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$PATH:$DEVKITARM/bin:$DEVKITPRO/tools/bin
          make clean
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webforge-ds-build
          path: ./webforge-ds.nds
