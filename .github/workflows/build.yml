name: Build WebForge DS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install devkitPro Dependencies
        run: |
          dkp-pacman -Sy --noconfirm \
            nds-dev \
            calico

      - name: Diagnose devkitPro layout
        run: |
          echo "=== pacman packages ==="
          dkp-pacman -Q | grep -E "calico|nds|libnds|libfat"
        
          echo "=== calico headers ==="
          find /opt/devkitpro -name "calico.h" 2>/dev/null
        
          echo "=== calico libs ==="
          find /opt/devkitpro -name "*.a" | grep -i calico
        
          echo "=== calico ARM7 binaries ==="
          find /opt/devkitpro -name "*.elf" | grep -i calico
        
          echo "=== libnds includes ==="
          ls /opt/devkitpro/libnds/include/
        
          echo "=== libnds libs ==="
          ls /opt/devkitpro/libnds/lib/

      - name: Compile NDS Binary
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$PATH:$DEVKITARM/bin:$DEVKITPRO/tools/bin
          make clean
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webforge-ds-build
          path: ./webforge-ds.nds
