name: Build WebForge DS - DIAGNOSTIC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install nds-dev
        run: dkp-pacman -Sy --noconfirm nds-dev

      - name: Full Environment Diagnostic
        run: |
          echo "======= PACMAN INSTALLED ======="
          dkp-pacman -Q

          echo "======= FIND calico.h ======="
          find /opt/devkitpro -name "calico.h" 2>/dev/null || echo "NOT FOUND"

          echo "======= FIND *.a (calico) ======="
          find /opt/devkitpro -name "*.a" | grep -i calico || echo "NOT FOUND"

          echo "======= FIND *.elf ======="
          find /opt/devkitpro -name "*.elf" 2>/dev/null || echo "NONE"

          echo "======= libnds/include/ ======="
          ls /opt/devkitpro/libnds/include/ || echo "DIR NOT FOUND"

          echo "======= libnds/include/nds.h line 220-230 ======="
          sed -n '220,230p' /opt/devkitpro/libnds/include/nds.h || echo "FILE NOT FOUND"

          echo "======= /opt/devkitpro tree (2 levels) ======="
          ls /opt/devkitpro/
          echo "---"
          ls /opt/devkitpro/libnds/ 2>/dev/null || echo "no libnds dir"
          echo "---"
          find /opt/devkitpro -maxdepth 3 -type d | sort
